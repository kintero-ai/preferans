<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d29">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Преферанс">
  <meta name="description" content="Преферанс «Сочи» на троих: вы против двух компьютерных соперников">
  <title>Преферанс</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="tbtn" id="btnMenu" aria-label="Меню">☰</button>
      <div class="deal-info" id="dealInfo"></div>
      <button class="tbtn" id="btnScore">Пуля</button>
    </header>
    <main class="table">
      <section class="opp" id="seat1"></section>
      <section class="opp" id="seat2"></section>
      <section class="center" id="center"></section>
    </main>
    <div class="mebar" id="mebar"></div>
    <div class="hand" id="hand"></div>
  </div>

  <div class="modal hidden" id="modal">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script src="js/cards.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
